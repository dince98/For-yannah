<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For Yannah ❤️</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #3b0000, #b30000);
      overflow: hidden;
      padding: 20px;
    }

    .card {
      background: white;
      width: 500px;
      max-width: 100%;
      padding: 40px 30px;
      border-radius: 25px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
      animation: pop 0.8s ease;
    }

    @keyframes pop {
      from {
        transform: scale(0.8);
        opacity: 0;
      }
      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    h1 {
      color: #d6004d;
      margin-bottom: 15px;
      font-weight: 700;
    }

    p {
      font-size: 18px;
      margin: 15px 0;
      color: #444;
      line-height: 1.7;
    }

    img {
      width: 200px;
      max-width: 100%;
      margin: 20px auto;
      display: block;
      border-radius: 12px;
    }

    button {
      padding: 15px 35px;
      font-size: 18px;
      border: none;
      border-radius: 40px;
      background: #ff4d88;
      color: white;
      cursor: pointer;
      transition: 0.3s;
      margin-top: 10px;
      font-weight: 500;
      letter-spacing: 0.5px;
    }

    button:hover {
      transform: scale(1.08);
      background: #e63e73;
      box-shadow: 0 8px 20px rgba(255, 77, 136, 0.4);
    }

    .sub {
      font-size: 16px;
      color: #777;
      margin-top: 5px;
    }

    /* responsive */
    @media (max-width: 480px) {
      .card {
        padding: 30px 20px;
      }
      h1 {
        font-size: 24px;
      }
      p {
        font-size: 16px;
      }
      button {
        padding: 12px 28px;
        font-size: 16px;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Hi Yannah ❤️</h1>
    <img src="https://media.tenor.com/yCFHzEvKa9MAAAAC/love-letter.gif" alt="love letter gif">
    <p>
      I made something special for you.<br>
      I hope you'll like it. <3
    </p>
    <p>
      Are you ready to see what's inside?
    </p>
    <button onclick="location.href='letterasd.html'">
      Open Letter 💌
    </button>
    <p class="sub">click the button to continue</p>
  </div>
</body>
</html>
